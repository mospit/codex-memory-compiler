[project]
name = "codex-memory-compiler"
version = "0.2.0"
description = "Markdown memory compiler for Codex app workflows"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.9.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-memory-compiler"
version = "0.2.0"
description = "Markdown memory compiler for Codex app workflows"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.9.0",
]

[project.scripts]
codex-memory = "codex_memory_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["codex_memory_compiler*"]

[tool.ruff]
line-length = 100
